{% assign repo_url = include.repository | split: '/' %}

<div class="repo p-2 text-center">
  <a href="https://github.com/{{ include.repository }}">
    <img
      class="repo-img-light w-100"
      alt="{{ include.repository }}"
      src="https://github-stats-extended.vercel.app/api/pin/?username={{ repo_url.first }}&repo={{ repo_url.last }}&theme={{ site.repo_theme_light }}&show_owner=false"
    >
    <img
      class="repo-img-dark w-100"
      alt="{{ include.repository }}"
      src="https://github-stats-extended.vercel.app/api/pin/?username={{ repo_url.first }}&repo={{ repo_url.last }}&theme={{ site.repo_theme_dark }}&show_owner=false"
    >
  </a>
</div>
